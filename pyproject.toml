[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "flask-async-celery"
version = "0.1.0"
description = "AsyncIO execution pool for Celery with Flask integration"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "celery>=5.6,<5.7",
    "Flask>=2.3",
]


[project.optional-dependencies]
redis = [
    "redis>=5.0",
]

test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]